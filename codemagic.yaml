workflows:
  android-debug:
    name: TWiLight Vault - Debug APK
    max_build_duration: 30
    instance_type: linux
    environment:
      vars:
        PACKAGE_NAME: "com.example.twilightvault"
      java: 17
    scripts:
      - name: Regenerate Gradle wrapper (ensures wrapper jar is present)
        script: |
          gradle wrapper --gradle-version 8.9
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
